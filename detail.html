<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>帖子详情 · 校园失物招领</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<header class="nav">
  <button class="nav-back" onclick="history.length>1?history.back():(location.href='/index.html')">‹</button>
  <h1>帖子详情</h1>
</header>

<main class="wrap" id="root">
  <div id="content"><div class="empty">加载中…</div></div>
</main>

<script src="/assets/app.js"></script>
<script>
(function () {
  const A = window.APP;
  A.mountTab('');
  const $ = (id) => document.getElementById(id);
  const postId = new URLSearchParams(location.search).get('id') || '';
  let DATA = null;

  function statusTag(p) {
    if (p.status === 'active') return '<span class="tag tag-blue">进行中</span>';
    if (p.status === 'claimed') return '<span class="tag tag-found">已认领</span>';
    return '<span class="tag tag-gray">已结束</span>';
  }

  function contactHtml(label, c) {
    if (!c) return '<div class="muted">未填写</div>';
    return Object.keys(c)
      .filter((k) => c[k])
      .map((k) => '<div>· ' + (k === 'wechat' ? '微信：' : '手机：') + A.esc(c[k]) + '</div>')
      .join('');
  }

  function render(d) {
    const p = d.post;
    const isOwner = d.isOwner;
    const mine = d.myClaim;
    let actionHtml = '';

    if (isOwner) {
      // 帖主视角
      let incoming = '';
      if (d.incoming && d.incoming.length) {
        incoming =
          '<div class="card"><div class="card-title">待处理认领申请 <span class="muted">' + d.incoming.length + ' 条</span></div>' +
          d.incoming
            .map(
              (c) =>
                '<div class="claim-item"><div class="row-between"><b>' + A.esc(c.claimerName) + '</b><span class="muted">' + A.ago(c.createTime) + '</span></div>' +
                '<div class="msg">' + A.esc(c.message) + '</div>' +
                '<div class="btn-row"><button class="btn btn-sm" data-reject="' + c._id + '">拒绝</button>' +
                '<button class="btn btn-sm btn-primary" data-accept="' + c._id + '">同意认领</button></div></div>'
            )
            .join('') +
          '<div class="muted">同意后双方联系方式互相可见' + (p.type === 'found' ? '，你还能获得 1 积分' : '') + '</div></div>';
      }

      let accepted = '';
      if (d.acceptedClaim) {
        accepted =
          '<div class="card"><div class="card-title" style="color:#17744a">已认领 · 对方联系方式</div>' +
          '<div class="contact-box"><b>' + A.esc(d.acceptedClaim.claimerName) + '</b><br>' +
          contactHtml('', d.acceptedClaim.claimerContact) + '</div>' +
          '<div class="muted" style="margin-top:10px">交接完成后点「结束信息」，帖子会关闭' +
          (p.type === 'found' && !p.pointCredited ? '，同时给你 +1 积分' : '') + '。</div></div>';
      }

      actionHtml =
        incoming +
        accepted +
        (p.status === 'active'
          ? '<button class="btn btn-danger btn-block" id="btnClose" style="margin-bottom:16px">结束信息</button>'
          : '');
    } else if (p.status === 'active') {
      if (mine && mine.status === 'pending') {
        actionHtml =
          '<div class="card"><div class="notice ok">你已提交认领申请，等待对方确认。' +
          '对方同意后这里会显示联系方式。</div>' +
          '<div class="muted">你的说明：' + A.esc(mine.message) + '</div></div>';
      } else if (mine && mine.status === 'accepted') {
        actionHtml = '<div class="card"><div class="notice ok">对方已同意你的认领，联系方式见上方。</div></div>';
      } else if (mine && mine.status === 'rejected') {
        actionHtml =
          '<div class="card"><div class="notice">上次申请未通过，你可以补充更具体的细节后再次申请。</div>' +
          '<button class="btn btn-primary btn-block" id="btnClaim">重新申请认领</button></div>';
      } else {
        actionHtml = '<button class="btn btn-primary btn-block" id="btnClaim" style="margin-bottom:16px">这是我的，申请认领</button>';
      }
    } else {
      actionHtml = '<div class="card"><div class="muted">这条信息已结束，不再接受认领。</div></div>';
    }

    $('content').innerHTML =
      '<div class="card">' +
      '<div class="row-between" style="margin-bottom:8px">' +
      '<div class="row"><span class="tag ' + (p.type === 'lost' ? 'tag-lost' : 'tag-found') + '">' + A.typeLabel(p.type) + '</span>' +
      statusTag(p) + (p.pointCredited ? '<span class="tag tag-blue">已归还 +1 分</span>' : '') + '</div>' +
      '<span class="muted">' + A.ago(p.createTime) + '</span>' +
      '</div>' +
      '<h2 style="margin:4px 0 6px;font-size:20px">' + A.esc(p.category) + '</h2>' +
      (d.matchedScore ? '<div class="muted" style="margin-bottom:10px">与你发布的帖子匹配度 <b style="color:#3a7afe">' + d.matchedScore + ' 分</b></div>' : '') +
      '<div class="desc" style="color:#37414f;font-size:14.5px;white-space:pre-wrap">' + A.esc(p.description) + '</div>' +
      '<div style="margin-top:12px">' +
      '<div class="kv"><span class="k">地点</span><span class="v">' + A.esc(A.locText(p)) + '</span></div>' +
      '<div class="kv"><span class="k">时间</span><span class="v">' + A.esc(A.timeText(p)) + '</span></div>' +
      (p.color ? '<div class="kv"><span class="k">颜色</span><span class="v">' + A.esc(p.color) + '</span></div>' : '') +
      (p.brand ? '<div class="kv"><span class="k">品牌</span><span class="v">' + A.esc(p.brand) + '</span></div>' : '') +
      (p.idTail ? '<div class="kv"><span class="k">证件尾号</span><span class="v">' + A.esc(p.idTail) + '（完整号码仅后台比对）</span></div>' : '') +
      '</div></div>' +

      '<div class="card"><div class="card-title">联系方式</div>' +
      (p.contactVisible
        ? '<div class="contact-box">' + contactHtml('', p.contact) + '</div>'
        : '<div class="lock-box">' + A.ICO.lock + '双方确认认领后才会互相可见，避免被无关的人打扰</div>') +
      '</div>' +
      actionHtml;

    if ($('btnClaim')) $('btnClaim').onclick = openClaim;
    if ($('btnClose')) $('btnClose').onclick = onClose;
  }

  function openClaim() {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML =
      '<div class="modal"><h3>申请认领</h3>' +
      '<p style="margin-bottom:12px">说清楚能证明东西是你的，通过率会高很多。</p>' +
      '<div class="field"><label>物品细节</label><textarea id="clMsg" maxlength="200" placeholder="例如：卡套背面贴了柯基贴纸，学号 2023 开头"></textarea></div>' +
      '<div class="field"><label>微信号</label><input id="clWx" type="text" placeholder="选填" /></div>' +
      '<div class="field" style="margin-bottom:14px"><label>手机号</label><input id="clPhone" type="tel" placeholder="选填" /></div>' +
      '<div class="btn-row"><button class="btn" id="clCancel">取消</button><button class="btn btn-primary" id="clOk">提交申请</button></div></div>';
    document.body.appendChild(mask);
    mask.querySelector('#clCancel').onclick = () => mask.remove();
    mask.addEventListener('click', (e) => {
      if (e.target === mask) mask.remove();
    });
    mask.querySelector('#clOk').onclick = async () => {
      const message = mask.querySelector('#clMsg').value.trim();
      const contact = { wechat: mask.querySelector('#clWx').value.trim(), phone: mask.querySelector('#clPhone').value.trim() };
      if (message.length < 5) return A.toast('请描述能证明物品归属的细节（至少 5 个字）');
      if (!contact.wechat && !contact.phone) return A.toast('请至少留一种联系方式');
      const r = await A.api('claim', { method: 'POST', body: { action: 'create', postId, message, contact } });
      if (!r.ok) return A.toast(r.errMsg || '提交失败');
      mask.remove();
      A.toast(r.tip || '已提交申请');
      load();
      A.refreshUnread();
    };
  }

  async function onClose() {
    const isFound = DATA.post.type === 'found';
    const ok = await A.confirm(
      '结束这条信息？',
      isFound
        ? '确认后帖子不再出现在搜索结果中，也不会再参与匹配。\n（招领帖结束将获得 1 积分）'
        : '确认后帖子不再出现在搜索结果中，也不会再参与匹配。',
      '确认结束'
    );
    if (!ok) return;
    const r = await A.api('claim', { method: 'POST', body: { action: 'close', postId } });
    if (!r.ok) return A.toast(r.errMsg || '操作失败');
    A.toast(r.credited ? '已结束，+1 积分' : '已结束');
    load();
    A.refreshUnread();
  }

  async function accept(claimId) {
    const isFound = DATA.post.type === 'found';
    const ok = await A.confirm(
      '同意这条认领？',
      '同意后对方会看到你的联系方式，其他待处理申请会自动拒绝。' + (isFound ? '\n（捡到物品的一方 +1 积分）' : ''),
      '同意'
    );
    if (!ok) return;
    const r = await A.api('claim', { method: 'POST', body: { action: 'accept', claimId } });
    if (!r.ok) return A.toast(r.errMsg || '操作失败');
    A.toast(r.creditedTo === 'me' ? '已同意，你 +1 积分' : r.creditedTo === 'other' ? '已同意，对方 +1 积分' : '已同意');
    load();
    A.refreshUnread();
  }

  async function reject(claimId) {
    const ok = await A.confirm('拒绝这条申请？', '对方可以补充细节后再次申请。', '拒绝');
    if (!ok) return;
    const r = await A.api('claim', { method: 'POST', body: { action: 'reject', claimId } });
    if (!r.ok) return A.toast(r.errMsg || '操作失败');
    A.toast('已拒绝');
    load();
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-accept]');
    if (a) return accept(a.getAttribute('data-accept'));
    const r = e.target.closest('[data-reject]');
    if (r) return reject(r.getAttribute('data-reject'));
  });

  async function load() {
    if (!postId) {
      $('content').innerHTML = '<div class="empty">缺少帖子 id</div>';
      return;
    }
    const d = await A.api('post?id=' + encodeURIComponent(postId));
    if (!d.ok) {
      $('content').innerHTML = '<div class="empty">' + A.esc(d.errMsg || '加载失败') + '</div>';
      return;
    }
    DATA = d;
    render(d);
    A.refreshUnread();
  }

  load();
})();
</script>
</body>
</html>
